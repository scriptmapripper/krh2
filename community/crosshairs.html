<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crosshairs — Krunker Resource Hub</title>
<link rel="stylesheet" href="community.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><a href="../index.html">◂ Krunker Resource Hub</a></div>
    <div class="topnav" id="topnav"></div>
  </div>

  <div class="card">
    <h1>Crosshairs</h1>
    <p class="subtitle">Community-made crosshairs. Build your own at
      <a href="../crosshair-maker.html" style="color:var(--blue-glow); text-decoration:underline;">Custom Crosshair Maker</a>,
      then post it here so others can use it.</p>
  </div>

  <div class="card" id="submitCard" style="display:none;">
    <h2>Post Your Crosshair</h2>
    <label>Title</label>
    <input type="text" id="pTitle" placeholder="Your crosshair name">
    <label>Crosshair Code</label>
    <textarea id="pContent" placeholder="Paste the code from Crosshair Maker here, or write a description"></textarea>
    <p class="hint">Code from the Custom Crosshair Maker can be pasted directly here.</p>
    <button class="btn green" id="btnPublish">Publish Crosshair</button>
    <div class="msg" id="createMsg"></div>
  </div>

  <div class="card" id="loginPrompt">
    <p class="subtitle" style="margin-bottom:14px;">Log in to post your own crosshair.</p>
    <a href="login.html" class="btn ghost" style="display:block; text-align:center; margin-bottom:10px;">Login</a>
    <a href="signup.html" class="btn" style="display:block; text-align:center;">Sign Up</a>
  </div>

  <div class="card" id="logoutCard" style="display:none;">
    <button class="btn logout-btn" id="btnLogout">Logout</button>
  </div>
</div>

<script src="supabase-client.js"></script>
<script>
let me = null;

async function boot() {
  me = await getSessionUser();
  const nav = document.getElementById("topnav");

  if (me) {
    const profile = await getMyProfile();
    let links = `<a href="dashboard.html">Dashboard</a>`;
    if (profile.role === "admin" || profile.role === "developer") links += `<a href="admin.html">Admin Panel</a>`;
    if (profile.role === "developer") links += `<a href="developer.html">Developer Panel</a>`;
    links += `<span style="color:var(--text-1); font-size:13.5px; margin-left:4px;">${escapeHtml(profile.display_name)} ${roleBadge(profile.role)}</span>`;
    links += `<a href="settings.html" style="margin-left:6px;">Settings</a>`;
    nav.innerHTML = links;
    document.getElementById("logoutCard").style.display = "block";
    document.getElementById("btnLogout").addEventListener("click", async (e) => {
      e.preventDefault();
      if (!confirm("Are you sure you want to log out?")) return;
      await sb.auth.signOut(); window.location.reload();
    });

    document.getElementById("submitCard").style.display = "block";
    document.getElementById("loginPrompt").style.display = "none";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (code) {
      document.getElementById("pContent").value = code;
      document.getElementById("pTitle").focus();
    }
  } else {
    nav.innerHTML = `<a href="login.html">Login</a><a href="signup.html">Sign Up</a>`;
  }

  loadFeed();
}

document.getElementById("btnPublish")?.addEventListener("click", async () => {
  const msg = document.getElementById("createMsg");
  const title = document.getElementById("pTitle").value.trim();
  const content = document.getElementById("pContent").value.trim();
  if (!title || !content) {
    msg.className = "msg error show"; msg.textContent = "Title & code are required.";
    return;
  }
  const { error } = await sb.from("posts").insert({
    author_id: me.id, title, content, status: "published", category: "crosshair",
  });
  if (error) {
    msg.className = "msg error show"; msg.textContent = error.message;
    return;
  }
  msg.className = "msg ok show"; msg.textContent = "Your crosshair has been posted!";
  document.getElementById("pTitle").value = "";
  document.getElementById("pContent").value = "";
  loadFeed();
  try {
    if (window.parent && typeof window.parent.loadCrosshairGallery === "function") {
      window.parent.loadCrosshairGallery("crosshair");
    }
  } catch(e) { /* cross-origin or not embedded — ignore */ }
});

async function loadFeed() {
  /* The list view now lives in the "Community Crosshairs" gallery on the
     main placeholder page — publishing here still writes to the posts
     table with category "crosshair", it's just not re-listed here. */
}

async function copyCode(btn, id) {
  const code = decodeURIComponent(btn.getAttribute("data-code"));
  try {
    await navigator.clipboard.writeText(code);
    const old = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = old; }, 1500);
  } catch(e) {
    alert("Auto-copy failed. Code: " + code);
  }
}

boot();
</script>
</body>
</html>
